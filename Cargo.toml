[workspace]
resolver = "2"
members = [
    "example-pages-generator",
    "monstertruck",
    "monstertruck-assembly",
    "monstertruck-core",
    "monstertruck-derive",
    "monstertruck-fillet",
    "monstertruck-geometry",
    "monstertruck-healing",
    "monstertruck-io",
    "monstertruck-traits",
    "monstertruck-wasm",
    "monstertruck-meshing",
    "monstertruck-modeling",
    "monstertruck-gpu",
    "monstertruck-mesh",
    "monstertruck-render",
    "monstertruck-solid",
    "monstertruck-step",
    "monstertruck-topology",
]

[workspace.dependencies]

# External dependencies
ahash = "0.8"
anyhow = "1"
array-macro = "2"
async-trait = "0.1"
bytemuck = { version = "1", features = ["derive"] }
cgmath = { version = "0.18", features = ["serde"] }
chrono = { version = "0.4", features = ["wasmbind"] }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
console_error_panic_hook = "0.1"
console_log = "1"
derive_more = { version = "2", features = ["full"] }
env_logger = "0.11"
futures-intrusive = "0.5"
getrandom = { version = "0.4", features = ["wasm_js"] }
gloo = "0.12"
image = "0.25"
itertools = "0.14"
js-sys = "0.3"
log = "0.4"
matext4cgmath = "0.1"
num-traits = "0.2"
naga = { version = "29", features = ["wgsl-in"] }
parking_lot = "0.12"
pollster = "0.4"
proc-macro-error = "1"
proc-macro2 = "1"
proptest = "1"
quote = "1"
rand = "0.10"
rayon = "1"
rkyv = { version = "0.8", features = ["alloc"] }
rclite = "0.4"
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
step-p21 = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
spade = "2"
syn = { version = "2", features = ["derive", "printing"] }
thiserror = { version = "2", default-features = false }
ttf-parser = "0.25"
# `default-features = false` drops vtkio's compression feature, which is the
# only thing pulling `lz4_flex` (RUSTSEC-2026-0041). Ported from upstream truck
# d6625230. Gating `vtk` off by default hid the advisory from the default
# feature set but not from anyone who turned the feature on; this removes it.
vtkio = { version = "0.6", default-features = false, features = ["xml"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
web-time = "1"
wgpu = "29"
winit = "0.30"

# Internal crates
monstertruck-assembly = { version = "0.4.0", path = "monstertruck-assembly" }
monstertruck-core = { version = "0.4.0", path = "monstertruck-core" }
monstertruck-derive = { version = "0.4.0", path = "monstertruck-derive" }
monstertruck-fillet = { version = "0.4.0", path = "monstertruck-fillet" }
monstertruck-geometry = { version = "0.4.0", path = "monstertruck-geometry" }
monstertruck-healing = { version = "0.4.0", path = "monstertruck-healing" }
# `default-features = false` here so each consumer names the formats it wants;
# a workspace-inherited dependency cannot have this overridden downstream.
monstertruck-io = { version = "0.4.0", path = "monstertruck-io", default-features = false }
monstertruck-mesh = { version = "0.4.0", path = "monstertruck-mesh" }
monstertruck-meshing = { version = "0.4.0", path = "monstertruck-meshing" }
monstertruck-modeling = { version = "0.4.0", path = "monstertruck-modeling" }
monstertruck-gpu = { version = "0.4.0", path = "monstertruck-gpu" }
monstertruck-render = { version = "0.4.0", path = "monstertruck-render" }
monstertruck-solid = { version = "0.4.0", path = "monstertruck-solid" }
monstertruck-step = { version = "0.4.0", path = "monstertruck-step" }
monstertruck-topology = { version = "0.4.0", path = "monstertruck-topology" }
monstertruck-traits = { version = "0.4.0", path = "monstertruck-traits" }


# Build scripts and proc-macro crates otherwise compile with full debug info,
# and cargo NEVER garbage-collects the old ones: every fingerprint change writes
# a new `target/debug/build/<crate>/<hash>/` and leaves each earlier hash in
# place, so the directory grows without bound across ordinary builds and CI runs.
#
# Nobody debugs a build script, so this costs nothing.
[profile.dev.build-override]
debug = false

[profile.release.package.monstertruck-wasm]
opt-level = "z"
